[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tooth-seg"
version = "0.1.0"
description = "Binary and multi-class tooth segmentation for panoramic dental radiographs"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tooth_seg*", "training*"]
